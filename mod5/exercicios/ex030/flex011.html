<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .container{
            display: flex;
            background-color: #ffa07a;
            border: 1px solid black;
            flex-flow: row nowrap;
        }
        
        .item{
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
        }

        #a{
            /*
            flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 250px;
            */

            flex:1 0 250px;
        }

        #b{
            /*
            flex-shrink: 2;
            flex-grow: 1;
            flex-basis: 250px;
            */

            flex:1 2 250px;
        }

        #c{
            /*
            flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 250px;
            */

            flex:1 0 250px;
        }

        /*
        isso é so nos flex-itens
        valor padrao e nome:
        0v-vnão cresce ou diminui
        1 -vsim cresce ou diminui
        2 - ele cresce ou diminui o dobro do 1(ele usa um valor de referencia)
        3,4... - ele cresce ou diminui o dobro do valor de referencia
        flex-grow: 0; - crescer
        flex-shrink: 1 ; - diminuir 
        
        
        flex-basis trabalha com flex-shrink e grow mas use a propriedade que junta todas elas o flex,
        
        flex:grow shrink basis;

        valor padrão - flex:0 1 auto; ou flex:initial;

        nada flexivel - flex:0 0 auto; ou flex:none;

        flexivel máximo - flex:1 1 auto; ou flex:auto;

        se colocar apenas um valor tipo flex:3; é igual a flex:3 1 auto; 
        */
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="a">A</div>
        <div class="item" id="b">B</div>
        <div class="item" id="c">C</div>
    </div>
</body>
</html>
