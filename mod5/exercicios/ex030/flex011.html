<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .container{
            display: flex;
            background-color: #ffa07a;
            border: 1px solid black;
            flex-flow: row nowrap;
        }
        
        .item{
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;
        }

        #a{
            flex-shrink: 1;
            flex-grow: 0;
        }

        #b{
            flex-shrink: 1;
            flex-grow: 2;
        }

        #c{
            flex-shrink: 1;
            flex-grow: 0;
        }

        /*
        isso é so nos flex-itens
        valor padrao e nome:
        0v-vnão cresce ou diminui
        1 -vsim cresce ou diminui
        2 - ele cresce ou diminui o dobro do 1(ele usa um valor de referencia)
        3,4... - ele cresce ou diminui o dobro do valor de referencia
        flex-grow: 0; - crescer
        flex-shrink: 1 ; - diminuir 
        
        
        flex-basis trabalha com flex-shrink e grow
        */
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="a">A</div>
        <div class="item" id="b">B</div>
        <div class="item" id="c">C</div>
    </div>
</body>
</html>
