<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex direction</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;/*row ve do lado esquerdo para o direito tipo lendo qualquer coisa, row-reverse ver do lado direito para o esquerdo tipo mangá , column linha vertical com itens para cima e descendo pra baixo,column-reverse linha vertical vendo os itens de baixo subindo pra cima */
            background-color: aquamarine;
            border: 1px solid black;
        }

        .item{
            background-color: rgb(60, 255, 0);
            border: 1px solid black;
            margin: 10px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
