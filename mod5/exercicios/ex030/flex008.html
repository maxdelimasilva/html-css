<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .container{
            display: flex;
            background-color: aquamarine;
            border: 1px solid black;
            align-items: flex-start;
            height: 400px;
        }
        
        .item{
            background-color: rgb(60, 255, 0);
            border: 1px solid black;
            padding: 20px;
        }

        #i1{
            align-self: auto;
        }

        #i2{
            align-self: center;
        }

        #i3{
            align-self: flex-start;
        }

        #i4{
            align-self: flex-end;
        }

        #i5{
            align-self: stretch;
        }


        
        /*O item pode ser flexivel e sempre esta dentro de um container, flex:auto; é uma propriedade do flex item*/

        /*order:0; ordem de exbição dos valores no itens, segue a ordem do menor ao maior ex: item1 com numeor 5 vai ficar em quinto lugar  item -4 ficara em -4*/

         /*
        justify content,align content e items sao pra o container e nao para os itens internos
        */

        /*
        valor padrao do auto sem um align definido ele vira strech

        align-self alinhamento que altera o item,direcionando ele  pelo  cross axis;
        
        align-self:auto; ele alinha baseado no seu container pai, ou seja se for flex-end,start,center ele seguira ;

        align-self:flex-start; ele alinha  perto do cross start;

        align-self:flex-end; ele alinha perto do cross-end;

        align-self:center; ele calcula pra centralizalo entre o cross-start e end;

        align-self:strech; ele puxa o item pra ocupar todo o cross(eixo transversal)

        lembrando que isso dependera tbm do column e row;
        */
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
