<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container{
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: 100px 100px 100px ;
            justify-content:center;
            align-content: center;

            height: 300px;
            
            background-color: lightsalmon;
            border:3px solid blue;
        }

        div.item{
            background-color: lightskyblue;
            border: 3px solid red;
            padding: 5px;
        }

        /*
            strech valor padrão para items.
            start valor padrão para content.

            Alinhamento horizontal:
            -justify-items:stretch,start,end,center;
            -justify-content:start,center,end,space-between,space-evenly,space-around;

            Alinhamento vertcial:
            -align-items:stretch ou start ou center ou end ou baseline;
            -aling-content: start, center, end, space-between,space-evenly, space-around;
        */
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
