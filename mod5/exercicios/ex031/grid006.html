<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container{
            display: grid;
            grid-template: repeat(3, 100px) / repeat(4, 1fr);
            gap: 10px;

            
            background-color: lightsalmon;
            border:3px solid blue;
        }

        div.item{
            background-color: lightskyblue;
            border: 3px solid red;
            padding: 5px;
        }

        /*
        propriedade de itens:
        grid-column-start ou grid-column-end ou grid-row start ou grid : ele pega a linha o track da coluna ou linha 
        */
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
    </div>
</body>
</html>
