<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container{
            display: grid;
            grid-template: 100px 100px 100px / auto auto auto;
            place-items: stretch center;
            place-content: start end;

            background-color: lightsalmon;
            border:3px solid blue;
        }

        div.item{
            background-color: lightskyblue;
            border: 3px solid red;
            padding: 5px;
        }

        /*
            grid-auto-column e grid-auto-row serve quando é utilizando mais itens do que foi determinado assim conseguindo comportar este itens.

            grid-template:grid-template-rows  grid-template-column
            place-items: align-items justify-items
            place-content: align-content justify-content
        */
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
    </div>
</body>
</html>
