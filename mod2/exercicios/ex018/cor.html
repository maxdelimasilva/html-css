<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        *{ /*Configurações globais do CSS*/
            height: 100%;
        }
        body{
            background-image: linear-gradient(45deg,#3198e2,#6d59c0 40%,#b93590,#e33f5f ,#fdd579);/*direção , cores e colocar a sua presença *//*existe o radial-gradient*/
            background-attachment: fixed; /*Fixa o plano de fundo, para não se mover quando a barra de rolagem for usada*/
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
