<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*
            #     = id
            .     = class
            :     = pseudo-classes
            ::    = pseudo-element
            >     = children
        */

        body{
            font-family:Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
        }

        a:visited{
            color:darkred;
        }

        a:hover{
            color:black;
            text-decoration: underline;
        }

        a:active{
            color:yellow;
        }

        .especial{
            background-color: rgba(255, 0, 0, 0.445);
        }

        /*:: = pseudo-elementos*/
        .especial::before{
            content: '→ '
        }

        .especial::after{
            content:' ←';
        }

    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositorio Github</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" target="_blank" class="especial">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com" target="_blank" class="especial">Site do Curso em Video</a></li>
    </ul>
</body>
</html>
