<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face{
            font-family: 'space';
            src:url("fonts/PLANK___.TTF") format('truetype'),url(fonts/PLANK___.INF) format();
            font-weight: normal;
            font-style: normal;
        }
        /*
            Tipos de format()
            -opentype (otf)
            -truetype (ttf)
            -embedded-opentype
            -truetype-aat (Apple Advanced Typography)
            -svg
        */
        body{
            font-family:Arial, Helvetica, sans-serif;
        }

        h1{
            font-family: 'space',Times New Roman, Times, serif;
            font-size: 3em;
            color:red;
        }
    </style>
</head>
<body>
    <h1>Olá mundo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ducimus dolorem earum laudantium facilis tempore deserunt, laborum sunt placeat pariatur natus iste sint iusto perspiciatis maiores nemo iure! Aliquam, cum magnam.</p>
</body>
</html>
