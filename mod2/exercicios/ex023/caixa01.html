<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 { /*block level/
            /*display:inline; eu mudo o display block pra inline*/
            background-color: lightgray;
            height: 300px;
            width: 300px;
            
           /* border-width: 10px;
            border-style:solid;
            border-color: black;
            
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            
            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;

            outline-width: 5px;
            outline-style:dashed;
            outline-color:red;*/

            border: 10px solid black;

            padding: 10px 20px 10px 20px;/* ou padding:10px; para todos ou padding:10px 10px primeiro cima e baixo depois direita e esquerda*/

            margin:10px 20px 10px 20px;/*o mesmo que o padding*/

            outline:10px dashed red;
        }

        a {/*inline-level*/
            /*display:block; transforma em block-level*/
            border-width: 10px;
            border-style: solid;
            border-color: darkred;
            
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
