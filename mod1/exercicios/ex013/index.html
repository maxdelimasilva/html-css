<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu servidor</p>
    <video width="560" poster="imagens/thumb.jpg" controls loop>
        <source src="midia/meuvideo_mp4.mp4" type="video/mp4">
        <source src="midia/meuvideo_webm.webm" type="video/webm">
        <source src="midia/meuvideo_mp4.ogv" type="video/ogv">
    </video>
    <p>Seu computador não tem compatibilidade com reprodutor de vídeos.</p>

    <h1>Inserindo vídeos do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/Q8tGvYsQ3XM?si=tQSR3VOgcmvx-YM6" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
    <h1>Inserindo vídeo do Vimeo</h1>
    <div style="padding:56.25% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/951001208?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:560px;height:315px;" title="Botanica. Synthetic Nature: Life Imagined by the Machine."></iframe></div><script src="https://player.vimeo.com/api/player.js"></script>
</body>
</html>
