<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 500px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de iframe</h1>
    <p>Acessando o site do
        <!--inline frameborder = iframe
            Tamanho padrão 300x150
        -->
        <iframe src="https://www.cursoemvideo.com" frameborder="1" height="500" scolling="yes">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
        </iframe><!--Abre uma aba para vc ver o site,video-->

        para aprender a programar
    </p>
    <p>O site do google <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">
        <a href="https://gustavoguanabara.github.io">Github</a>
    </iframe></p>
</body>
</html>
