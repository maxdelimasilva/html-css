<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            border: 1px solid black;
            border-collapse: collapse;
        }

        th {
            background-color: aquamarine;
            padding: 10px;
            border: 1px solid black;
        }

        td{
            border: 1px solid black;
            padding: 20px;
            text-align: center;/*Alinhamento horizontal*/
            vertical-align: middle;/*Alinhamento vertical*/
        }

        .numero{
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--Hierarquia da tabela
        table - tabela
            table row -linha da tabela
                table header - cabeçalho da tabela
                table data - dados da tabela
    -->
    <table>
        <tr>
            <th>A</th>
            <th>B</th>
            <th>C</th>
        </tr>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>
        <tr>
            <th>A4</th>
            <th>B4</th>
            <th>C4</th>
        </tr>
    </table>
</body>
</html>
